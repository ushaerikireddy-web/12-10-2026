{% extends "base.html" %}
{% block title %}Register — {{ PLATFORM_NAME }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<h2>Student Registration</h2>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-success w-100">Register</button></form>
<p class="mt-3">Instructor? <a href="{% url 'accounts:register-instructor' %}">Register as instructor</a></p>
</div></div>
{% endblock %}
