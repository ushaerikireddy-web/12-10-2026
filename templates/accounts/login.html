{% extends "base.html" %}
{% block title %}Login — {{ PLATFORM_NAME }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<h2>Login</h2>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100">Login</button></form>
<p class="mt-3"><a href="{% url 'password_reset' %}">Forgot password?</a> · <a href="{% url 'accounts:register' %}">Create account</a></p>
</div></div>
{% endblock %}
