{% extends "student_base.html" %}
{% block title %}Edit Profile — VIDYA{% endblock %}
{% block content_block %}
<div class="vidya-content-card">
<h2><i class="bi bi-pencil me-1"></i>Edit Profile</h2>
<p class="text-muted small">Changes save to the server on submit. Photo uploads go to Django media storage.</p>
<form method="post" enctype="multipart/form-data" data-validate>{% csrf_token %}{{ form.as_p }}
<button class="btn btn-emerald">Save Changes</button> <a class="btn btn-outline-secondary" href="{% url 'accounts:profile' %}">Cancel</a></form>
</div>
{% endblock %}
