{% extends "student_base.html" %}
{% block title %}{{ test.title }} Quiz — VIDYA{% endblock %}
{% block content_block %}
<div class="vidya-content-card">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h3 class="mb-0"><i class="bi bi-patch-question me-1"></i>{{ test.title }}</h3>
    <span class="badge bg-dark quiz-timer"><i class="bi bi-clock me-1"></i><span id="q-timer">--:--</span></span>
  </div>
  <p class="text-muted small">{{ test.desc }} · Demo scoring in-browser, not saved to server.</p>
  <div id="vidya-quiz" data-quiz-json='{{ quiz_json|escapejs }}' data-duration="{{ test.duration }}">
    <div id="q-body">
      <p id="q-count" class="fw-bold"></p>
      <h4 id="q-title"></h4>
      <div id="q-opts" class="my-3"></div>
      <div class="d-flex justify-content-between"><button id="q-prev" class="btn btn-outline-secondary">Previous</button><button id="q-next" class="btn btn-emerald">Next</button></div>
    </div>
    <div id="q-result" style="display:none"></div>
  </div>
</div>
{% endblock %}
