{% extends "base.html" %}
{% block content %}<h2>Submit: {{ assignment.title }}</h2>

<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Submit</button></form>
{% endblock %}
